<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=744, initial-scale=1" />
<title>Salem — Les sabliers de Bab El Oued</title>
<style>
  :root {
    --ink: #fffaf0;
    --gold: #f6d58a;
    --gold-bright: #fff2bd;
    --navy: #101c2c;
    --navy-deep: #08121e;
    --glass: rgba(10, 19, 31, .94);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 744px; height: 1039px; overflow: hidden; }
  body {
    background: #08121e;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
  }
  .card {
    position: relative;
    width: 744px;
    height: 1039px;
    overflow: hidden;
    border: 12px solid #c28c3d;
    border-radius: 28px;
    background: var(--navy-deep);
    box-shadow: inset 0 0 0 3px #fff0b2, inset 0 0 0 9px #4e3519;
  }
  .art {
    position: absolute;
    inset: 0 0 285px;
    background-image: linear-gradient(to bottom, rgba(7, 15, 26, .06) 50%, rgba(7, 15, 26, .24) 72%, rgba(7, 15, 26, .95) 100%), url('../client/public/cards/sabliers-bab-el-oued/salem-art.png');
    background-position: center top;
    background-size: cover;
    filter: saturate(.98) contrast(1.02);
  }
  .art::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(255, 240, 178, .45);
    border-radius: 14px;
    pointer-events: none;
  }
  .topbar {
    position: absolute;
    z-index: 2;
    top: 22px;
    left: 26px;
    right: 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .name {
    padding: 9px 20px 11px;
    border: 2px solid var(--gold);
    border-radius: 6px 18px 6px 18px;
    background: rgba(8, 18, 30, .88);
    color: var(--gold-bright);
    font-size: 42px;
    font-weight: 700;
    line-height: .9;
    letter-spacing: .02em;
    text-shadow: 0 2px 10px #000;
  }
  .cost {
    display: grid;
    place-items: center;
    width: 73px;
    height: 73px;
    border: 3px solid var(--gold-bright);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #fff6cf, #e5ad4f 38%, #784511 100%);
    color: #152034;
    font-size: 40px;
    font-weight: 800;
    box-shadow: 0 0 0 4px rgba(8, 18, 30, .72), 0 5px 18px rgba(0,0,0,.42);
  }
  .rules {
    position: absolute;
    z-index: 2;
    left: 24px;
    right: 24px;
    bottom: 28px;
    min-height: 246px;
    padding: 26px 28px 22px;
    border: 2px solid var(--gold);
    border-radius: 16px 16px 28px 28px;
    background: linear-gradient(150deg, rgba(17, 32, 49, .98), rgba(7, 17, 28, .98));
    box-shadow: inset 0 0 0 2px rgba(255,240,178,.14), 0 -24px 40px rgba(5, 11, 20, .45);
  }
  .rules::before, .rules::after {
    content: "";
    position: absolute;
    top: -2px;
    width: 92px;
    height: 2px;
    background: var(--gold-bright);
  }
  .rules::before { left: 34px; }
  .rules::after { right: 34px; }
  .effect-label {
    margin-bottom: 13px;
    color: var(--gold);
    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  .effect {
    margin: 0;
    color: #fbf7e9;
    font-family: Arial, sans-serif;
    font-size: 21px;
    line-height: 1.38;
  }
  .effect strong { color: #ffe7a6; }
  .footer {
    position: absolute;
    right: 28px;
    bottom: 12px;
    color: rgba(246, 213, 138, .66);
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .stats {
    position: absolute;
    z-index: 3;
    right: 26px;
    bottom: 300px;
    display: flex;
    gap: 10px;
  }
  .stat {
    display: grid;
    place-items: center;
    width: 80px;
    height: 80px;
    border: 2px solid var(--gold-bright);
    border-radius: 13px 4px 13px 4px;
    background: rgba(8, 18, 30, .9);
    box-shadow: 0 5px 15px rgba(0,0,0,.3);
  }
  .stat b { font-size: 36px; line-height: .85; color: var(--gold-bright); }
  .stat span { margin-top: 2px; font-family: Arial,sans-serif; font-size: 10px; letter-spacing: .16em; color: #b9c5d2; }
</style>
</head>
<body>
  <main class="card" aria-label="Carte de jeu Salem">
    <div class="art"></div>
    <div class="topbar">
      <div class="name">Salem</div>
      <div class="cost" aria-label="Coût 4">4</div>
    </div>
    <div class="stats" aria-label="Force 4, vie 3">
      <div class="stat"><b>4</b><span>FORCE</span></div>
      <div class="stat"><b>3</b><span>VIE</span></div>
    </div>
    <section class="rules">
      <div class="effect-label">Bouclier de lumière</div>
      <p class="effect"><strong>À son arrivée en jeu</strong>, Salem reçoit un bouclier de lumière. Tant que ce bouclier n’a pas été touché par une attaque ou une magie ennemie, il ne peut pas subir de dégâts.</p>
      <div class="footer">Les sabliers de Bab El Oued</div>
    </section>
  </main>
</body>
</html>
