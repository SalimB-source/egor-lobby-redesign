name: Fetch original EGOR lobby assets

on:
  push:
    paths:
      - "tools/fetch-egor/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original lobby markup
        run: |
          mkdir -p tools/fetch-egor/out client/public/arenas
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'
          for attempt in 1 2 3; do
            code=$(curl -sSL --compressed --max-time 60 -A "$UA" \
              -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
              -H 'Accept-Language: en-US,en;q=0.9,fr;q=0.8' \
              -H 'Upgrade-Insecure-Requests: 1' \
              -w '%{http_code}' -D "tools/fetch-egor/out/lobby-attempt${attempt}.headers" \
              -o "tools/fetch-egor/out/lobby-attempt${attempt}.html" \
              https://egorgaming.com/lobby || true)
            echo "attempt ${attempt}: HTTP ${code}, $(wc -c < "tools/fetch-egor/out/lobby-attempt${attempt}.html" 2>/dev/null || echo 0) bytes"
            cp "tools/fetch-egor/out/lobby-attempt${attempt}.html" tools/fetch-egor/out/lobby.html 2>/dev/null || true
            if [ -s tools/fetch-egor/out/lobby.html ] && grep -qi 'uploads/arenas' tools/fetch-egor/out/lobby.html; then
              echo "attempt ${attempt}: looks like the real page"
              break
            fi
            sleep 5
          done
          echo "--- first 400 chars of what we got ---"
          head -c 400 tools/fetch-egor/out/lobby.html || true
          echo
          echo "--- write a compact diagnostic ---"
          {
            echo "bytes: $(wc -c < tools/fetch-egor/out/lobby.html)"
            echo "arena upload refs: $(grep -o 'uploads/arenas' tools/fetch-egor/out/lobby.html | wc -l)"
            echo "arental markers: $(grep -o 'Top Arenas' tools/fetch-egor/out/lobby.html | wc -l)"
            echo "title: $(grep -o '<title>[^<]*</title>' tools/fetch-egor/out/lobby.html | head -1)"
          } | tee tools/fetch-egor/out/diagnostic.txt

      - name: Slice out the Top Arenas markup
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('tools/fetch-egor/out/lobby.html')
          html = p.read_text('utf-8', 'ignore') if p.exists() else ''
          out = pathlib.Path('tools/fetch-egor/out/top-arenas.html')
          idx = html.find('Top Arenas')
          if idx == -1:
              out.write_text(html[:40000], 'utf-8')
              print('no Top Arenas anchor; dumped the head instead')
          else:
              out.write_text(html[max(0, idx - 6000): idx + 20000], 'utf-8')
              print(f'top-arenas slice written (anchor at {idx})')
          PY
          grep -o 'app\.egorgaming\.com/uploads/arenas/[0-9]*/avatar/[^"'"'"' ]*' tools/fetch-egor/out/lobby.html \
            | sort -u > tools/fetch-egor/out/arena-icons.txt || true
          cat tools/fetch-egor/out/arena-icons.txt || true

      - name: Download every arena icon
        continue-on-error: true
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'
          while read -r path; do
            [ -n "$path" ] || continue
            id=$(printf '%s' "$path" | sed -n 's#.*/arenas/\([0-9]*\)/avatar/.*#\1#p')
            [ -n "$id" ] || continue
            ext="${path##*.}"
            curl -sSL --compressed --max-time 60 -A "$UA" -e https://egorgaming.com/lobby \
              -w "arena ${id}: HTTP %{http_code} %{size_download}B\n" -o "client/public/arenas/arena-${id}.${ext}" \
              "https://${path}" || true
          done < tools/fetch-egor/out/arena-icons.txt
          ls -la client/public/arenas || true

      - name: Commit fetched assets
        run: |
          git config user.name 'arena-ai-coding-agent[bot]'
          git config user.email '298482267+arena-ai-coding-agent[bot]@users.noreply.github.com'
          git add -A tools/fetch-egor client/public/arenas
          if git diff --cached --quiet; then
            echo 'nothing to commit'
          else
            git commit -m 'chore(tools): fetch original EGOR lobby arena icons [skip ci]'
            git push
          fi
