name: Fetch original EGOR lobby assets

on:
  push:
    paths:
      - "tools/fetch-egor/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original lobby markup
        run: |
          set -euo pipefail
          mkdir -p tools/fetch-egor/out client/public/arenas
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'
          code=$(curl -sSL --compressed -A "$UA" \
            -H 'Accept: text/html,application/xhtml+xml' \
            -H 'Accept-Language: en-US,en;q=0.9,fr;q=0.8' \
            -w '%{http_code}' -o tools/fetch-egor/out/lobby.html \
            https://egorgaming.com/lobby)
          echo "lobby HTTP $code, $(wc -c < tools/fetch-egor/out/lobby.html) bytes"

      - name: Slice out the Top Arenas markup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path('tools/fetch-egor/out/lobby.html').read_text('utf-8', 'ignore')
          idx = html.find('Top Arenas')
          chunk = html[max(0, idx - 4000): idx + 14000] if idx != -1 else html[:20000]
          pathlib.Path('tools/fetch-egor/out/top-arenas.html').write_text(chunk, 'utf-8')
          print(f'top-arenas slice: {len(chunk)} bytes (anchor at {idx})')
          PY
          grep -o 'app\.egorgaming\.com/uploads/arenas/[0-9]*/avatar/[^"'"'"']*' tools/fetch-egor/out/lobby.html | sort -u | tee tools/fetch-egor/out/arena-icons.txt

      - name: Download every arena icon
        run: |
          set -euo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36'
          while read -r path; do
            [ -n "$path" ] || continue
            id=$(printf '%s' "$path" | sed -n 's#.*/arenas/\([0-9]*\)/avatar/.*#\1#p')
            [ -n "$id" ] || continue
            ext="${path##*.}"
            out="client/public/arenas/arena-${id}.${ext}"
            curl -sSL --compressed -A "$UA" -e https://egorgaming.com/lobby \
              -w "arena ${id}: HTTP %{http_code} %{size_download}B -> ${out}\n" \
              -o "$out" "https://${path}"
          done < tools/fetch-egor/out/arena-icons.txt
          ls -la client/public/arenas

      - name: Commit fetched assets
        run: |
          set -euo pipefail
          git config user.name 'arena-ai-coding-agent[bot]'
          git config user.email '298482267+arena-ai-coding-agent[bot]@users.noreply.github.com'
          git add -A tools/fetch-egor client/public/arenas
          git commit -m 'chore(tools): fetch original EGOR lobby arena icons [skip ci]' || echo 'nothing to commit'
          git push
