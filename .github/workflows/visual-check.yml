name: Visual check (arena section)

on:
  push:
    paths:
      - "tools/visual-check/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    env:
      OUT: ${{ github.workspace }}/tools/visual-check/out
      TARGET_URL: http://127.0.0.1:4173/egor-lobby-redesign/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm run build

      - name: Serve the built site
        run: |
          set -euo pipefail
          mkdir -p /tmp/serve/egor-lobby-redesign
          cp -r dist/public/. /tmp/serve/egor-lobby-redesign/
          (cd /tmp/serve && nohup python3 -m http.server 4173 >/tmp/serve.log 2>&1 &)
          sleep 3
          curl -s -o /dev/null -w "index: HTTP %{http_code}\n" "$TARGET_URL"

      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw
          cd /tmp/pw
          npm init -y >/dev/null
          npm i playwright@1.49.1 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Screenshot the arena section
        run: |
          mkdir -p "$OUT"
          set +e
          NODE_PATH=/tmp/pw/node_modules node tools/visual-check/shots.js >/tmp/shots.log 2>&1
          status=$?
          set -e
          tail -80 /tmp/shots.log
          ls -la "$OUT" || true
          if [ "$status" -ne 0 ]; then
            # Surface the reason as an annotation: the raw log blobs are not
            # reachable from the editing sandbox.
            msg=$(tail -c 2500 /tmp/shots.log \
              | sed 's/%/%25/g; s/\r/%0D/g' \
              | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=arena shots failed::${msg}"
          fi
          exit "$status"

      - name: Commit screenshots
        if: always()
        run: |
          git config user.name 'arena-ai-coding-agent[bot]'
          git config user.email '298482267+arena-ai-coding-agent[bot]@users.noreply.github.com'
          git add -A tools/visual-check
          if git diff --cached --quiet; then
            echo 'nothing to commit'
          else
            git commit -m 'chore(tools): arena section screenshots [skip ci]'
            git push
          fi
